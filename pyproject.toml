[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t7-agent"
version = "0.2.1"
description = "Triple Seven agent by Byteramp: threat modeling, verified fixes and proof for every pull request. Your code never leaves your environment."
requires-python = ">=3.10"
dependencies = []          # stdlib only: small supply-chain surface, easy to audit
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Byteramp" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://byteramp.se"
Source = "https://github.com/byteramp/triple-seven"
Security = "https://github.com/byteramp/triple-seven/security/policy"

[project.scripts]
t7 = "t7.cli:main"

[tool.setuptools.packages.find]
include = ["t7*"]
