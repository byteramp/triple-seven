# Triple Seven agent — signed release.
#
# Trigger: push a tag `vX.Y.Z` (must match pyproject.toml and t7/__init__.py).
#   git tag v0.1.0 && git push origin v0.1.0
#
# Every release ships:
#   • wheel + sdist → PyPI via Trusted Publishing (no token stored anywhere)
#   • CycloneDX SBOM, SHA256SUMS
#   • Sigstore signatures (keyless, this workflow's GitHub identity)
#   • SLSA build provenance + SBOM attestations (gh attestation verify)
#   • GitHub release; the moving major tag (v0) for `uses: byteramp/triple-seven@v0`
#
# Dry run without publishing: Actions → release → Run workflow.
# Supply chain: pin every `uses:` to a commit SHA before v1 (Dependabot keeps them fresh).

name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest tests -q
      - name: Agent must stay stdlib-only
        run: |
          python - <<'EOF'
          import tomllib
          deps = tomllib.load(open('pyproject.toml', 'rb'))['project'].get('dependencies', [])
          assert deps == [], f'third-party runtime dependencies are not allowed: {deps}'
          EOF

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # Sigstore keyless signing + attestations
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version must match tag, pyproject and t7/__init__
        id: version
        run: |
          PY_VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT_VER=$(python -c "import re;print(re.search(r\"__version__ = '([^']+)'\", open('t7/__init__.py').read()).group(1))")
          test "$PY_VER" = "$INIT_VER" || { echo "pyproject $PY_VER != t7/__init__ $INIT_VER"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v${PY_VER}" || { echo "tag ${GITHUB_REF_NAME} != v${PY_VER}"; exit 1; }
          fi
          echo "version=${PY_VER}" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist (reproducible timestamp)
        run: |
          python -m pip install build==1.2.2
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build --outdir dist .

      - name: SBOM (CycloneDX) — exactly what a customer installs
        run: |
          python -m venv --without-pip /tmp/sbom-env
          python -m pip --python /tmp/sbom-env/bin/python install dist/*.whl
          python -m pip install cyclonedx-bom==5.1.1
          cyclonedx-py environment /tmp/sbom-env/bin/python \
            --of JSON --output-reproducible -o dist/t7-agent.cdx.json

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.whl
            ./dist/*.tar.gz
            ./dist/t7-agent.cdx.json
            ./dist/SHA256SUMS

      - name: Build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: SBOM attestation
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/*.whl
          sbom-path: dist/t7-agent.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi               # required reviewer → nothing ships without a click
      url: https://pypi.org/project/t7-agent/
    permissions:
      id-token: write          # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: mkdir upload && mv dist/*.whl dist/*.tar.gz upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          attestations: true   # PEP 740 attestations on PyPI

  github-release:
    needs: [build, publish-pypi]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release + move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Triple Seven agent ${VERSION}" \
            --notes "Signed with Sigstore (keyless, this workflow's identity), CycloneDX SBOM and SLSA provenance attached. Verify: see RELEASING.md."
          MAJOR="v${VERSION%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${MAJOR}" -m "Triple Seven ${VERSION}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${MAJOR}"
